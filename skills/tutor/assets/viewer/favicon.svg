<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- rounded square in the app's surface color -->
  <rect x="1" y="1" width="30" height="30" rx="7"
        fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <!-- terminal chevron  >  -->
  <path d="M9 11 l5 5 -5 5" fill="none"
        stroke="#58a6ff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor underscore  _ -->
  <line x1="17" y1="21.5" x2="24" y2="21.5"
        stroke="#58a6ff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
